[workspace]
resolver = "2"
members = [
    "crates/ada_ast",
    "crates/ada_lexer",
    "crates/ada_parser",
    "crates/ada_bytecode",
    "crates/ada_vm",
    "crates/ada_engine",
    "crates/ada_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ada-D Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustyline = "15.0"
